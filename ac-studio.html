<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>과제 개발 포털</title>
<!--
  역량평가 과제 개발 포털 화면 시안. 기준 문서: docs/ac-portal-spec.md (v0.7)
  - 화면 원칙은 명세 2-1, 화면 용어는 명세 2-2를 따른다.
  - AI 응답, 음성 인식, 파일 처리는 이 파일 안의 예시 데이터로 흉내 낸다.
  - 예시 과제(한빛시 공영자전거)는 시안용으로 지어낸 내용이다. 실제 과제·양식의 내용은 넣지 않았다.
  - 실제 연결 시 바꿀 곳은 "API 연결 지점" 주석으로 표시했다.
-->
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#101828; --sub:#475467; --faint:#667085; --line:#e4e7ec; --soft:#f2f4f7;
    --accent:#1d4ed8; --accent-hover:#1e40af; --accent-soft:#eef2ff; --on-accent:#fff;
    --ok:#067647; --ok-soft:#dcfae6; --add:#dcfae6; --add-t:#067647; --del:#fee4e2; --del-t:#b42318;
    --warn:#fff4e5; --warn-t:#93370d; --danger:#b42318;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06); color-scheme:light dark;
  }
  html { scroll-padding-top:140px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f1115; --card:#181b21; --text:#eef0f3; --sub:#b4bac5; --faint:#98a0ad; --line:#2c313a; --soft:#22262e;
    --accent:#8ea8ff; --accent-hover:#a9bcff; --accent-soft:#1d2540; --on-accent:#0b1020;
    --ok:#6fdcaa; --ok-soft:#0f3a2a; --add:#0f3a2a; --add-t:#7ce0b0; --del:#4a1d1a; --del-t:#ff9c94;
    --warn:#3a2a12; --warn-t:#ffc274; --danger:#ff9c94; --shadow:none; } }
  :root[data-theme="dark"] {
    --bg:#0f1115; --card:#181b21; --text:#eef0f3; --sub:#b4bac5; --faint:#98a0ad; --line:#2c313a; --soft:#22262e;
    --accent:#8ea8ff; --accent-hover:#a9bcff; --accent-soft:#1d2540; --on-accent:#0b1020;
    --ok:#6fdcaa; --ok-soft:#0f3a2a; --add:#0f3a2a; --add-t:#7ce0b0; --del:#4a1d1a; --del-t:#ff9c94;
    --warn:#3a2a12; --warn-t:#ffc274; --danger:#ff9c94; --shadow:none; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; font-size:15px; word-break:keep-all; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button, a, label { touch-action:manipulation; }
  select { background-color:var(--card); color:var(--text); }
  h1, h2 { text-wrap:balance; }
  table, .line, .pg, .cnt { font-variant-numeric:tabular-nums; }
  .skip { position:absolute; left:8px; top:-48px; z-index:100; background:var(--accent); color:var(--on-accent); padding:8px 12px; border-radius:8px; }
  .skip:focus { top:8px; }
  button, a, label.slot, [data-act] { cursor:pointer; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .ic { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  .ic.lg { width:20px; height:20px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* 머리 */
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .hd { max-width:1320px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .logo { font-weight:700; font-size:16px; background:none; border:none; display:flex; align-items:center; gap:8px; }
  .crumb { color:var(--sub); font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stepper { max-width:1320px; margin:0 auto; padding:0 16px 10px; display:flex; gap:6px; overflow-x:auto; list-style:none; }
  .stepper button { display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border:1px solid var(--line); background:var(--card);
                    border-radius:999px; white-space:nowrap; min-height:40px; transition:border-color .15s; }
  .stepper button:hover { border-color:var(--accent); }
  .stepper .num { width:26px; height:26px; border-radius:50%; background:var(--soft); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .stepper .name { font-weight:600; font-size:14px; }
  .stepper .st { font-size:12px; color:var(--faint); }
  .stepper .on { border-color:var(--accent); background:var(--accent-soft); }
  .stepper .on .num { background:var(--accent); color:var(--on-accent); }
  .stepper .done .num { background:var(--ok-soft); color:var(--ok); }
  .stepper .done .st { color:var(--ok); }

  main { max-width:1320px; margin:0 auto; padding:20px 16px 48px; }
  .narrow { max-width:780px; }
  h1 { font-size:22px; line-height:1.35; margin-bottom:6px; }
  h2 { font-size:17px; margin:24px 0 10px; }
  h3 { font-size:16px; }
  .lead { color:var(--sub); margin-bottom:18px; }
  .muted { color:var(--faint); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:0; }
  .field { margin-bottom:18px; }
  .field > label, .lbl { display:block; font-weight:600; margin-bottom:6px; }
  .req { color:var(--danger); font-weight:400; font-size:13px; margin-left:4px; }
  .opt { color:var(--faint); font-weight:400; font-size:13px; margin-left:4px; }
  .help { color:var(--faint); font-size:13px; margin-top:6px; }
  input[type=text], textarea, select { width:100%; min-height:40px; padding:8px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  textarea { resize:vertical; min-height:76px; }
  input[type=checkbox], input[type=radio] { width:17px; height:17px; accent-color:var(--accent); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; padding:7px 14px; border:1px solid var(--line);
         background:var(--card); border-radius:8px; font-weight:500; transition:background .15s, border-color .15s; text-decoration:none; color:var(--text); }
  .btn:hover { border-color:var(--faint); }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .btn.pri:hover { background:var(--accent-hover); }
  .btn.danger { color:var(--danger); border-color:var(--danger); }
  .btn.sm { min-height:32px; padding:4px 10px; font-size:13px; }
  .btn.link { border:none; background:none; color:var(--accent); padding:4px 2px; min-height:0; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .big { width:100%; min-height:46px; font-size:16px; }
  .chip { min-height:38px; padding:6px 14px; border:1px solid var(--line); background:var(--card); border-radius:999px; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:1px 8px; border-radius:6px; background:var(--soft); color:var(--sub); }
  .tag.blue { background:var(--accent-soft); color:var(--accent); }
  .tag.warn { background:var(--warn); color:var(--warn-t); }
  .tag.ok { background:var(--ok-soft); color:var(--ok); }
  .slot { display:flex; align-items:center; gap:12px; padding:14px; border:1.5px dashed var(--line); border-radius:var(--radius); background:var(--card); margin-bottom:10px; }
  .slot:hover { border-color:var(--accent); }
  .slot.ok { border-style:solid; border-color:var(--ok); }
  .slot input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
  .slot .t { font-weight:600; }
  .slot .s { font-size:13px; color:var(--faint); }
  .slot.ok .s { color:var(--ok); }
  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th, table.t td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  table.t th { background:var(--soft); font-weight:600; }
  .tablewrap { overflow-x:auto; }
  .note { display:flex; gap:10px; align-items:flex-start; background:var(--warn); color:var(--warn-t); border-radius:var(--radius); padding:12px 14px; margin:10px 0; font-size:14px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg);
           padding:10px 16px; border-radius:10px; font-size:14px; z-index:60; max-width:90vw; display:flex; gap:8px; align-items:center; }
  .hidden { display:none !important; }

  /* 단계 공통 틀 */
  .guide { display:flex; gap:12px; align-items:flex-start; background:var(--accent-soft); border-radius:var(--radius); padding:14px 16px; margin-bottom:18px; }
  .guide .ic { color:var(--accent); margin-top:3px; }
  .guide ol { margin:4px 0 0 18px; font-size:14px; color:var(--sub); }
  .guide b { color:var(--text); }
  .stepnav { display:flex; gap:8px; align-items:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .progress { list-style:none; margin:24px auto; max-width:420px; }
  .progress li { display:flex; gap:10px; align-items:center; padding:8px 0; color:var(--faint); }
  .progress li.done { color:var(--ok); } .progress li.now { color:var(--text); font-weight:600; }
  .spin { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 0.8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .dotc { width:16px; height:16px; border:2px solid var(--line); border-radius:50%; flex:none; }

  /* 시작 화면 */
  .hero { display:flex; gap:16px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; margin-bottom:8px; }
  .flow { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
  .flow .card { margin:0; display:flex; flex-direction:column; gap:6px; }
  .flow .n { width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; display:flex; align-items:center; justify-content:center; }
  .flow dt { font-size:12px; color:var(--faint); margin-top:4px; } .flow dd { font-size:14px; }
  .flow .btn { margin-top:auto; }
  @media (max-width:1100px) { .flow { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:560px) { .flow { grid-template-columns:1fr; } }
  .projrow { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--line); }
  .projrow:last-child { border-bottom:none; }

  /* 주제 후보 */
  .cand .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:12px 0; }
  @media (max-width:640px) { .cand .grid { grid-template-columns:1fr; } }
  .cand ul { list-style:none; } .cand li { font-size:14px; padding:3px 0; display:flex; gap:6px; align-items:flex-start; }
  .cand li .ic { margin-top:4px; }
  .okc { color:var(--ok); } .warnc { color:var(--warn-t); }

  /* 편집 화면 */
  .coach { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--accent); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .coach div { display:flex; gap:10px; font-size:14px; }
  .coach b.n { width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:inline-flex; align-items:center; justify-content:center; flex:none; font-size:13px; }
  @media (max-width:900px) { .coach { grid-template-columns:1fr; } }
  .ed { display:grid; grid-template-columns:240px minmax(0,1fr) 360px; gap:12px; align-items:start; }
  .ed > section { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); min-height:540px; box-shadow:var(--shadow); }
  .tree { padding:12px 10px; font-size:14px; display:flex; flex-direction:column; }
  .tree .head { font-weight:700; padding:0 8px 6px; display:flex; gap:6px; align-items:center; }
  .tree .top { font-size:13px; font-weight:700; margin:12px 8px 2px; color:var(--text); }
  .tree .grp { font-size:12px; color:var(--faint); font-weight:600; margin:10px 8px 2px; }
  .tree button.it { display:flex; gap:6px; align-items:center; width:100%; text-align:left; border:none; background:none; padding:7px 8px; border-radius:6px; min-height:36px; }
  .tree button.it:hover { background:var(--soft); }
  .tree button.it[aria-current="true"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tree .pg { color:var(--faint); font-size:12px; margin-left:auto; white-space:nowrap; }
  .legend { margin-top:auto; border-top:1px solid var(--line); padding:10px 8px 0; font-size:12px; color:var(--faint); display:grid; gap:4px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; display:inline-block; }
  .cnt { font-size:12px; background:var(--warn); color:var(--warn-t); border-radius:6px; padding:0 6px; }
  .impc { color:var(--warn-t); display:inline-flex; }
  .docbar { padding:10px 12px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  .docbar .lbl { margin:0; font-size:13px; color:var(--faint); font-weight:600; }
  .ckbtn { display:inline-flex; gap:6px; align-items:center; min-height:34px; padding:4px 10px; border:1px solid var(--line); background:var(--card); border-radius:8px; font-size:13px; }
  .ckbtn:hover { border-color:var(--c); }
  .ckbtn i { width:10px; height:10px; border-radius:3px; background:var(--c); display:inline-block; }
  .doc { padding:22px 26px; }
  .doc .title { font-size:19px; font-weight:700; }
  .doc .meta { color:var(--faint); font-size:13px; margin-bottom:14px; }
  .doc p { margin:6px 0; white-space:pre-wrap; }
  .doc table { border-collapse:collapse; margin:6px 0; font-size:14px; }
  .doc td { border:1px solid var(--line); padding:5px 10px; }
  .doc .sheet { font-size:13px; color:var(--accent); font-weight:600; margin-top:14px; }
  .doc .figure { display:flex; gap:8px; align-items:center; border:1px dashed var(--line); color:var(--faint); font-size:13px; padding:10px; border-radius:8px; margin:6px 0; }
  mark.iss { background:none; color:inherit; border-bottom:3px solid var(--c); cursor:pointer; }
  mark.iss.sel { background:var(--warn); }
  ins { background:var(--add); color:var(--add-t); text-decoration:none; }
  del { background:var(--del); color:var(--del-t); }
  .side { display:flex; flex-direction:column; height:660px; position:sticky; top:130px; }
  .ptabs { display:flex; border-bottom:1px solid var(--line); }
  .ptabs button { flex:1; display:flex; gap:6px; align-items:center; justify-content:center; border:none; background:none; padding:10px 4px; min-height:44px; color:var(--faint); border-bottom:2px solid transparent; font-size:14px; }
  .ptabs button[aria-selected="true"] { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
  .pbody { flex:1; overflow-y:auto; padding:12px; }
  .empty { text-align:center; padding:28px 12px; color:var(--faint); font-size:14px; }
  .empty .ic { width:28px; height:28px; margin-bottom:8px; }
  .msg { padding:8px 12px; border-radius:10px; margin-bottom:8px; font-size:14px; white-space:pre-wrap; }
  .msg.me { background:var(--accent-soft); margin-left:28px; }
  .msg.ai { background:var(--soft); margin-right:28px; }
  .ex { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:14px; }
  .ex:hover { border-color:var(--accent); }
  .issue { border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:12px; margin-bottom:10px; font-size:14px; }
  .issue.done { opacity:.6; }
  .issue .h { display:flex; justify-content:space-between; gap:6px; margin-bottom:4px; }
  .issue .loc { color:var(--faint); font-size:13px; }
  .issue label { font-size:13px; font-weight:600; display:block; margin-top:8px; }
  .issue textarea { min-height:48px; font-size:14px; margin:4px 0 8px; }
  .issue .ref { font-size:13px; color:var(--faint); margin-top:6px; display:flex; gap:6px; }
  .ask { border-top:1px solid var(--line); padding:10px; }
  .scope { font-size:13px; margin-bottom:6px; display:flex; gap:6px; align-items:center; color:var(--faint); }
  .scope span { background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:6px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ask form { display:flex; gap:6px; }
  .hist { font-size:13px; border-bottom:1px solid var(--line); padding:10px 0; }
  .pop { position:absolute; z-index:40; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px;
         box-shadow:0 8px 28px rgba(0,0,0,.18); display:flex; gap:6px; flex-wrap:wrap; max-width:330px; }
  .impact { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--warn); color:var(--warn-t); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  .summary { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .mtabs, .mtabs.seg { display:none; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); }
  .seg button { border:none; background:none; padding:8px 14px; min-height:40px; color:var(--sub); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); font-weight:600; }
  @media (max-width:1060px) {
    .ed { grid-template-columns:1fr; }
    .ed > section { min-height:0; }
    .ed > section.mhide { display:none; }
    .side { height:600px; position:static; }
    .mtabs, .mtabs.seg { display:inline-flex; margin-bottom:10px; width:100%; }
    .mtabs button { flex:1; min-height:44px; }
    .doc { padding:16px; }
  }

  /* 녹취록 */
  .substeps { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .substeps button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; min-height:38px; font-size:14px; color:var(--sub); }
  .substeps button[aria-current="step"] { border-color:var(--accent); color:var(--accent); font-weight:600; background:var(--accent-soft); }
  .spk { display:inline-flex; gap:8px; align-items:center; min-height:40px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .spk:hover { border-color:var(--sc); }
  .spk i { width:10px; height:10px; border-radius:50%; background:var(--sc); display:inline-block; }
  .line { display:grid; grid-template-columns:130px 92px 1fr; gap:10px; padding:8px; border-radius:8px; align-items:start; }
  .line:hover { background:var(--soft); }
  .line.on { background:var(--accent-soft); }
  .line .who { font-weight:600; color:var(--sc); font-size:14px; }
  .line .who select { font-size:13px; padding:2px 6px; min-height:30px; margin-top:2px; }
  .line .txt { outline:none; border-radius:4px; padding:2px 4px; }
  .line .txt:focus { background:var(--card); box-shadow:0 0 0 2px var(--accent); }
  @media (max-width:640px) { .line { grid-template-columns:1fr; gap:2px; } }
  .player { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; background:var(--accent); color:var(--on-accent); padding:8px 12px; border-radius:8px; margin-bottom:8px; font-size:14px; }
  .player .btn { color:var(--text); }
  .report { background:var(--card); border:1px solid var(--line); padding:24px; border-radius:4px; font-size:14px; }
  .report .rt { text-align:center; font-weight:700; font-size:17px; margin-bottom:14px; }
  .report .src { font-size:12px; color:var(--accent); background:none; border:none; white-space:nowrap; text-decoration:underline; }
  .report td.loc { background:var(--soft); font-weight:600; }

const REVIEW_CHECK = { id:'review', name:'검토의견', color:'#2f5bea' };

// 블록: g=묶음, doc=평가과제/평가자가이드
const BLOCKS0 = [
  { id:'c0', doc:'평가과제', g:'구조', title:'표지', page:'', text:'평가대상자용 과제 : 집단토론(GD)\n[ 평가과제 ]\n평가과제는 총 9장(표지 제외)으로 구성되어 있습니다.\n평가 시작 전, 빠진 쪽이 없는지 확인하십시오.' },
  { id:'c1', doc:'평가과제', g:'구조', title:'평가방법 안내', page:'1', text:'· 평가 시간: 준비 30분, 토론 50분\n· 토론 중에는 자료에 메모할 수 있으나, 자료를 다른 평가대상자에게 보여 줄 수 없습니다.' },
  { id:'c2', doc:'평가과제', g:'구조', title:'상황개요', page:'2', text:'※ 오늘은 2031년 3월 4일(수)입니다.\n귀하는 한빛시 교통국 소속 과장입니다. 한빛시는 공영자전거 "한빛바이크"를 7년째 운영하고 있으나 이용 감소와 운영 적자가 이어지고 있습니다.\n회의 안건: ① 한빛바이크 재정비의 기본 방향 수립 ② 각 과가 제안한 세부 사업 중 3개 선정' },
  { id:'c3', doc:'평가과제', g:'구조', title:'가상조직', page:'3', text:'교통국장\n├ 교통정책과: 대중교통 정책 수립, 공영자전거 운영 총괄\n├ 재정관리과: 교통 사업 예산 편성·집행 관리\n└ 시민소통과: 민원 처리, 시민 의견 수렴' },
  { id:'d1', doc:'평가과제', g:'공통 자료', title:'자료 1. 신문기사', page:'4', text:'한빛바이크, 7년 만에 갈림길에 서다\n한빛일보 박○○ 기자 / 2031. 2. 20.\n한빛바이크 이용 건수는 2028년 연 410만 건에서 2030년 연 296만 건으로 줄었다. 같은 기간 고장 자전거 비율은 8%에서 15%로 높아졌다. 시민들은 "빌리러 가면 고장 난 자전거만 남아 있다"고 말한다.\n시는 올해 안에 운영 방식을 바꾸겠다는 입장이다.' },
  { id:'d2', doc:'평가과제', g:'공통 자료', title:'자료 2. 교통국장 이메일', page:'5', text:'보낸 사람: 교통국장\n받는 사람: 교통정책과장, 재정관리과장, 시민소통과장\n제목: 한빛바이크 재정비 회의 준비\n현재 대여소 320곳 가운데 이용이 적은 곳을 정리하고, 남는 예산을 정비 인력에 돌리는 방안도 검토해 주십시오. 회의에서 정한 사업은 바로 시행하고, 추가 예산은 교통정책과장이 직접 승인하는 것으로 하겠습니다.' },

  { id:'d5', doc:'평가과제', g:'평가대상자 B · 재정관리과', title:'자료 5. 재정관리과 제안 세부사업(안)', page:'11', text:'1) 정비 인력 확충: 정비 인력을 12명에서 20명으로 늘린다. 비용 연 4억 원.\n2) 정기권 가격 조정: 월 5천 원에서 7천 원으로 올린다. 수입이 연 2억 원 늘어날 것으로 본다.\n정비를 운영 하는 업체와의 계약은 2031년 6월에 끝난다.' },

  { id:'g1', doc:'평가자가이드', g:'평가자가이드', title:'과제 개요', page:'', text:'기법: 집단토론(3인)\n대상: 5급 과장급\n측정 역량: 문제해결, 조정·통합, 의사결정' },

  { id:'g3', doc:'평가자가이드', g:'평가자가이드', title:'자료별 쟁점과 정답 근거', page:'', text:'· 자료 3(2/2): 총 예산 48억 원 안에서 사업비 합계를 맞춰야 한다.\n· 자료 1·자료 3: 고장 비율이 8%에서 15%로 높아진 것이 이용 감소의 핵심 원인이다.\n· 자료 5: 정비 업체 계약 종료(2031년 6월)는 정비 방식을 바꿀 기회다.' },

function bodyHTML(b) {
  const marks = S.issues.filter(i => i.block === b.id && i.status === 'open');
  return b.text.split('\n').map(line => {
    if (/^\[\d+\/\d+\]/.test(line)) return `<div class="sheet">${esc(line)}</div>`;
    if (/^\[그림\]/.test(line)) return `<div class="figure">${ic('image')}${esc(line.slice(4).trim())} — 그림은 AI가 고치지 않습니다. 직접 고쳐 주세요.</div>`;
    let h = esc(line);
    marks.forEach(m => { const f = esc(m.find); if (h.includes(f)) h = h.replace(f, `<mark class="iss ${S.activeIssue===m.id?'sel':''}" style="--c:${chk(m.check).color}" data-act="focusIssue" data-v="${m.id}" tabindex="0" title="${esc(chk(m.check).name)}: 눌러서 이유 보기">${f}</mark>`); });
    if (line.startsWith('|')) return `<table><tr>${h.split('|').slice(1,-1).map(c=>`<td>${c.trim()}</td>`).join('')}</tr></table>`;
    return `<p>${h || '&nbsp;'}</p>`;
  }).join('').replace(/<\/table><table>/g,'');
}
function diffHTML(a, b) {
  if (a === b) return `<p class="muted">초안과 비교해 바뀐 부분이 없습니다.</p>` + bodyHTML({ ...B(S.cur), text:b });
  const A = a.split(/(\s+)/), Bt = b.split(/(\s+)/), n = A.length, m = Bt.length;
  const L = Array.from({length:n+1},()=>new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===Bt[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,out='';
  while (i<n && j<m) { if (A[i]===Bt[j]) { out+=esc(A[i]); i++; j++; } else if (L[i+1][j]>=L[i][j+1]) out+=`<del>${esc(A[i++])}</del>`; else out+=`<ins>${esc(Bt[j++])}</ins>`; }
  while (i<n) out+=`<del>${esc(A[i++])}</del>`; while (j<m) out+=`<ins>${esc(Bt[j++])}</ins>`;
  return `<p class="muted">초안과 비교: <del>지운 글자</del> <ins>넣은 글자</ins></p>` + out.split('\n').map(l=>`<p>${l||'&nbsp;'}</p>`).join('');
}

    const stops = text.split('\n').filter(l => /★정지/.test(l)).map(l => l.replace(/^#+\s*/, '').replace(/\s*★정지.*/, ''));
    if (p.id === 1) return [`주제 후보 ${(text.match(/후보 (\d+)개/) || [])[1] || '?'}개를 만듦`, text.includes('sources.md') ? '시의성 근거: 출처 목록 사용' : '시의성 근거: 점검표만 사용', `확인 단계 ${stops.length}개`];
    return [`확인 단계 ${stops.length}개: ${stops.join(', ') || '없음'}`, text.includes('실존 기관명') ? '실존 기관명을 걸러 냄' : '실존 기관명 점검 없음'];
  }
  return [`지침 ${text.split('\n').length}줄`, text.includes('할 예정임') ? '문장 끝 규칙 있음' : '문장 끝 규칙 없음'];
}
function doSave(p, text) {

function addHistory(block, before, after, who, why) {
  S.history.push({ v:S.history.length+1, block, before, after, who, why });
  // 작업 원칙 7: 바뀐 숫자가 다른 항목(가이드 포함)에도 있으면 "함께 확인 필요"
  const gone = before.split(/[\s,.:()]+/).filter(w => w.length>1 && /\d/.test(w) && !after.includes(w));
  S.blocks.forEach(x => { if (x.id !== block && gone.some(w => x.text.includes(w)))
    S.impact[x.id] = `${B(block).title}에서 "${gone.join(', ')}"을(를) 고쳤습니다. 이 항목에도 같은 내용이 있습니다.`; });
}
function setText(id, text, who, why) { const b = B(id); const before = b.text; if (before === text) return; b.text = text; addHistory(id, before, text, who, why); }
let issueSeq = 1;
function runCheck(id, quiet) {
  const c = chk(id);
  // 목차를 나누거나 합쳐도 찾을 수 있게, 원문이 들어 있는 항목을 다시 찾는다
  const where = f => (B(f.block) && B(f.block).text.includes(f.find)) ? f.block : (S.blocks.find(b => b.text.includes(f.find)) || {}).id;
  const found = FINDINGS.filter(f => f.check === id && where(f) && !S.issues.some(i => i.check===id && i.find===f.find && i.status==='open'));
  found.forEach(f => S.issues.push({ ...f, block:where(f), id:issueSeq++, status:'open' }));
  const total = S.issues.filter(i => i.check===id && i.status==='open').length;
  if (!quiet) { S.chat.push({ t:`${c.name} 점검을 마쳤습니다. 결과 ${total}건${FINDINGS.some(f=>f.check===id)?'':' (새로 등록한 항목은 시안에 예시 결과가 없습니다)'}.` }); S.panel = 'issues'; S.mtab = 'side'; }
  return total;
}
function runAll(stage) {
  const n = S.checks.filter(c => c.on && c.where.includes(stage)).reduce((s,c) => s + runCheck(c.id, true), 0);
  S.chat.push({ t:`전체 점검을 마쳤습니다. 결과 ${n}건.` }); S.panel = 'issues'; S.mtab = 'side'; render(); toast(`전체 점검 결과 ${n}건`);

  otherFix: el => { const i = S.issues.find(x => x.id === +el.dataset.v), alts = i.alts || FIX_ALTS[i.find] || [];
    const n = i.altNo || 0; if (n >= alts.length) { toast('시안에서는 이 항목의 다른 안 예시가 더 없습니다. 실제로는 AI가 다른 고친 안을 냅니다.'); return; }
    i.fix = alts[n]; i.altNo = n + 1; render(); const c = $('iss-' + i.id); c && c.scrollIntoView({ block:'nearest' }); },
  wholeEdit: () => runLoading('과제 전체를 읽고 고칠 곳을 찾는 중…', ['평가과제 전체 읽기','평가자가이드와 맞춰 보기','고칠 곳과 고친 안 정리'], '과제 크기에 따라 2~4분 걸립니다.', () => {
    let n = 0;
    WHOLE.forEach(w => { const b = S.blocks.find(x => x.text.includes(w.find));
      if (b && !S.issues.some(i => i.check === 'whole' && i.find === w.find && i.status === 'open')) { S.issues.push({ ...w, block:b.id, check:'whole', id:issueSeq++, status:'open' }); n++; } });
    S.chat.push({ t:`과제 전체를 읽고 고칠 곳 ${n}건을 제안했습니다. 점검 결과에서 하나씩 고르거나 [모두 반영]을 누르세요.` }); S.panel = 'issues'; S.mtab = 'side'; }),
  wholeAll: el => { const list = S.issues.filter(i => i.check === 'whole' && i.status === 'open');
    if (el.dataset.v === 'apply') { list.forEach(i => { const b = B(i.block); if (b.text.includes(i.find)) { setText(i.block, b.text.replace(i.find, i.fix), 'AI', `전체 수정 제안: “${i.find}” → “${i.fix}”`); i.status = 'applied'; } }); toast(`${list.length}건을 반영했습니다. 수정 기록에서 되돌릴 수 있습니다.`); }
    else { list.forEach(i => i.status = 'ignored'); toast(`${list.length}건을 반영하지 않았습니다.`); }
    render(); },
});

/* 이벤트 연결 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || (el.type === 'checkbox' && el.dataset.act !== 'diff')) return;
  if (el.tagName === 'A') e.preventDefault();
  if (ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); if (S.preview) { S.preview = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('mark.iss')) { e.preventDefault(); ACT.focusIssue(e.target); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.actSubmit === 'ask') { const v = $('askIn').value.trim(); if (v) ask(v); }
  if (e.target.dataset.actSubmit === 'ai') { const id = e.target.dataset.box, v = $('ai-' + id).value.trim(); if (v) aiRequest(id, v); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind) { const path = t.dataset.bind.split('.'); const o = path.length > 1 ? S[path[0]] : S; o[path[path.length-1]] = t.type === 'checkbox' ? t.checked : t.value; if (t.type !== 'text' && t.tagName !== 'TEXTAREA') render(); return; }
  if (t.dataset.s1) { S.s1[t.dataset.s1] = t.value; if (t.dataset.s1 === 'client') S.s1.grade = ''; render(); return; }
  if (t.dataset.s1c) { const c = S.s1.cond, k = t.dataset.s1c;
    if (k === 'n') { const n = +t.value; while (c.tasks.length < n) c.tasks.push({ comps:[] }); c.tasks.length = n; } else c[k] = t.value;
    render(); return; }
  if (t.dataset.s1q) { S.s1.answers[t.dataset.s1q] = t.value; render(); return; }
  if (t.dataset.pick) { S.s1.pick = +t.dataset.pick; render(); return; }
  if (t.dataset.slot === 'csv') { toast(`${t.files[0] ? t.files[0].name : ''}을(를) 읽었습니다. (시안) 실제로는 열 이름을 맞춰 보고 미리보기 뒤에 추가합니다.`); return; }
  if (t.dataset.slot) {
    const name = t.files[0] ? t.files[0].name : ''; if (!name) return;
    if (t.dataset.slot === 'audio') return startStt(name);
    if (t.dataset.slot === 'form') { toast(/\.hwp$/i.test(name) ? 'hwp 양식은 한글에서 "다른 이름으로 저장 → hwpx"로 바꾼 뒤 다시 올려 주세요.' : `${name}을(를) 읽고 칸 8개를 찾았습니다. (시안)`); return; }
    if (['pptx4','pptx5'].includes(t.dataset.slot)) { S.draft = 'struct'; S.structFile = name; render(); return; }
    if (t.dataset.slot in S.slots) { S.slots[t.dataset.slot] = name; render(); return; }
    toast(`${name}을(를) 올렸습니다. (시안)`); return;
  }
  if (t.dataset.field) { S.fields[+t.dataset.field].v = t.value; return; }
  if (t.dataset.line) { S.lines[+t.dataset.line].s = +t.value; render(); return; }
  if (t.dataset.grp) { B(t.dataset.grp).g = t.value; return; }
  if (t.dataset.req) { S.reqs[+t.dataset.req].on = t.checked; render(); return; }
  if (t.dataset.c) { const c = S.checks.find(x => x.id === t.dataset.c), k = t.dataset.k;
    if (k === 'where') c.where = t.checked ? [...c.where, +t.value].sort() : c.where.filter(w => w !== +t.value);
    else c[k] = t.type === 'checkbox' ? t.checked : t.value;
    render(); }
});
document.addEventListener('input', e => { const t = e.target;
  if (t.id === 'fileText' && !t.readOnly) { setSkillDraft(S.prompts.find(x => x.id === S.editPrompt), t.value); return; } if (t.dataset.bind && (t.type === 'text' || t.tagName === 'TEXTAREA')) { const p = t.dataset.bind.split('.'); S[p[0]][p[1]] = t.value; } });
document.addEventListener('focusout', e => { const t = e.target; if (t.dataset && t.dataset.txt) S.lines[+t.dataset.txt].text = t.innerText; });

/* 드래그 선택 → 작은 메뉴 */
function hidePop() { $('pop').classList.add('hidden'); }
document.addEventListener('mouseup', e => {
  if (e.target.closest('#pop')) return;
  const body = $('docbody'); const sel = window.getSelection(); const txt = sel.toString().trim();
  if (!body || !txt || txt.length < 2 || !body.contains(sel.anchorNode) || S.diff) { hidePop(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect(), pop = $('pop'), blk = S.cur;
  pop.innerHTML = `<button class="btn sm pri" id="popAi">${ic('chat')} AI에게 고쳐 달라고 하기</button><button class="btn sm" id="popMe">${ic('edit')} 직접 고치기</button>`;
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 340)) + 'px';
  pop.style.top = (window.scrollY + r.bottom + 6) + 'px';
  pop.classList.remove('hidden'); $('popAi').focus();
  $('popAi').onclick = () => { S.scope = { type:'sel', block:blk, text:txt, label:`선택한 글 “${txt.slice(0,20)}${txt.length>20?'…':''}”` }; S.panel = 'chat'; S.mtab = 'side'; render(); $('askIn').focus(); };
  $('popMe').onclick = () => {
    pop.innerHTML = `<label for="popTa" class="sr">고칠 글</label><textarea id="popTa" style="width:310px">${esc(txt)}</textarea><button class="btn sm pri" id="popSave">저장</button><button class="btn sm" id="popX">취소</button>`;
    $('popTa').focus();
    $('popX').onclick = hidePop;
    $('popSave').onclick = () => { const b = B(blk); if (!b.text.includes(txt)) { toast('여러 줄에 걸친 선택은 한 줄씩 고쳐 주세요.'); return; }
      setText(blk, b.text.replace(txt, $('popTa').value), '이용자', `직접 고침: “${txt.slice(0,30)}”`); hidePop(); render(); toast('고쳤습니다. 수정 기록에서 되돌릴 수 있습니다.'); };
  };
});
// 주소로 바로 열기: #step-3, #admin-checks
(function () { const h = location.hash; let m;
  if ((m = h.match(/^#step-([1-5])$/))) { S.view = 'stage'; S.stage = +m[1]; }
  else if ((m = h.match(/^#admin-(\w+)$/)) && ADMIN.some(a => a[0] === m[1])) { S.mode = 'admin'; S.adminTab = m[1]; } })();
// 고친 내용이 있는데 창을 닫으려 하면 묻기 (실제로는 서버에 자동 저장)
window.addEventListener('beforeunload', e => { if (S.history.length) { e.preventDefault(); e.returnValue = ''; } });
render();
</script>
</body>
</html>
