<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과제 개발 포털</title>
<!--
  역량평가 과제 개발 포털 화면 시안. 기준 문서: docs/ac-portal-spec.md (v0.3)
  - AI 응답, 음성 인식, 파일 처리는 이 파일 안의 예시 데이터로 흉내 낸다.
  - 예시 과제(한빛시 공영자전거)는 시안용으로 지어낸 내용이다. 실제 과제·양식의 내용은 넣지 않았다.
  - 실제 연결 시 바꿀 곳은 "API 연결 지점" 주석으로 표시했다.
-->
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --sub:#667085; --line:#e4e7ec; --soft:#f2f4f7;
    --accent:#2f5bea; --accent-soft:#eef2fe; --on-accent:#fff;
    --add:#dcfae6; --add-t:#067647; --del:#fee4e2; --del-t:#b42318; --warn:#fff4e5; --warn-t:#b54708;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#111317; --card:#1a1d23; --text:#eceef2; --sub:#9aa1ad; --line:#2b2f37; --soft:#22262d;
    --accent:#7c9bff; --accent-soft:#1f2740; --on-accent:#0d1020;
    --add:#0f3a2a; --add-t:#7ce0b0; --del:#4a1d1a; --del-t:#ff9c94; --warn:#3a2a12; --warn-t:#ffc274; } }
  :root[data-theme="dark"] {
    --bg:#111317; --card:#1a1d23; --text:#eceef2; --sub:#9aa1ad; --line:#2b2f37; --soft:#22262d;
    --accent:#7c9bff; --accent-soft:#1f2740; --on-accent:#0d1020;
    --add:#0f3a2a; --add-t:#7ce0b0; --del:#4a1d1a; --del-t:#ff9c94; --warn:#3a2a12; --warn-t:#ffc274; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; font-size:14px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }

  header { background:var(--card); border-bottom:1px solid var(--line); }
  .hd { max-width:1280px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .hd .logo { font-weight:700; }
  .hd .proj { color:var(--sub); font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:none; background:none; padding:6px 12px; font-size:13px; color:var(--sub); }
  .seg button.on { background:var(--accent); color:var(--on-accent); font-weight:600; }
  nav.stages { max-width:1280px; margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto; }
  nav.stages button { border:none; background:none; padding:10px 12px; color:var(--sub); border-bottom:2px solid transparent; white-space:nowrap; }
  nav.stages button.on { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
  nav.stages b { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%;
                 background:var(--soft); font-size:12px; margin-right:6px; }
  nav.stages button.on b { background:var(--accent); color:var(--on-accent); }
  nav.stages button.done b { background:var(--accent-soft); color:var(--accent); }

  main { max-width:1280px; margin:0 auto; padding:20px 16px 40px; }
  .narrow { max-width:760px; }
  h1 { font-size:21px; margin-bottom:4px; }
  h2 { font-size:16px; margin:20px 0 8px; }
  .lead { color:var(--sub); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .field { margin-bottom:16px; }
  .field > label, .lbl { display:block; font-weight:600; margin-bottom:6px; }
  .field small, .muted { color:var(--sub); font-weight:400; font-size:12px; }
  input[type=text], textarea, select { width:100%; padding:9px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; outline:none; }
  input[type=text]:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:0; }
  .chip { padding:7px 12px; border:1px solid var(--line); background:var(--card); border-radius:999px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .btn { padding:8px 14px; border:1px solid var(--line); background:var(--card); border-radius:8px; }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .btn.sm { padding:4px 10px; font-size:12px; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .big { width:100%; padding:12px; font-size:15px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:6px; background:var(--soft); color:var(--sub); }
  .tag.blue { background:var(--accent-soft); color:var(--accent); }
  .tag.warn { background:var(--warn); color:var(--warn-t); }
  .slot { display:flex; align-items:center; gap:10px; padding:12px; border:1px dashed var(--line); border-radius:10px; background:var(--card); margin-bottom:8px; }
  .slot.ok { border-style:solid; }
  .slot input[type=file] { display:none; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t th, table.t td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
  table.t th { background:var(--soft); font-weight:600; }
  .loading { padding:40px 0; text-align:center; color:var(--sub); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg);
           padding:10px 16px; border-radius:10px; font-size:13px; z-index:50; max-width:90vw; }
  .hidden { display:none !important; }

  /* 주제 후보 */
  .cand h3 { font-size:16px; margin-bottom:4px; }
  .cand .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
  @media (max-width:640px) { .cand .grid { grid-template-columns:1fr; } }
  .cand ul { list-style:none; } .cand li { font-size:13px; padding:2px 0; }

  /* 공통 편집 화면 */
  .ed { display:grid; grid-template-columns:230px minmax(0,1fr) 340px; gap:12px; align-items:start; }
  .ed > section { background:var(--card); border:1px solid var(--line); border-radius:12px; min-height:520px; }
  .tree { padding:10px; font-size:13px; }
  .tree .grp { font-size:12px; color:var(--sub); font-weight:600; margin:12px 6px 4px; }
  .tree .grp:first-child { margin-top:2px; }
  .tree .top { font-size:13px; color:var(--text); font-weight:700; margin:14px 6px 2px; }
  .tree button { display:flex; gap:6px; align-items:center; width:100%; text-align:left; border:none; background:none; padding:6px 8px; border-radius:6px; }
  .tree button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tree .pg { color:var(--sub); font-size:11px; margin-left:auto; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--add-t); flex:none; }
  .cnt { font-size:11px; background:var(--warn); color:var(--warn-t); border-radius:6px; padding:0 5px; }
  .docbar { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ckbtn { padding:5px 10px; border:1px solid var(--line); border-left:4px solid var(--c); background:var(--card); border-radius:6px; font-size:12px; }
  .doc { padding:20px 24px; }
  .doc .title { font-size:18px; font-weight:700; }
  .doc .meta { color:var(--sub); font-size:12px; margin-bottom:14px; }
  .doc p { margin:6px 0; white-space:pre-wrap; }
  .doc table { border-collapse:collapse; margin:6px 0; font-size:13px; }
  .doc td { border:1px solid var(--line); padding:5px 10px; }
  .doc .sheet { font-size:12px; color:var(--accent); font-weight:600; margin-top:14px; }
  .doc .figure { border:1px dashed var(--line); color:var(--sub); font-size:12px; padding:10px; border-radius:8px; margin:6px 0; }
  mark.iss { background:none; color:inherit; border-bottom:3px solid var(--c); cursor:pointer; padding-bottom:1px; }
  mark.iss.sel { background:var(--warn); }
  ins { background:var(--add); color:var(--add-t); text-decoration:none; }
  del { background:var(--del); color:var(--del-t); }
  .impact { background:var(--warn); color:var(--warn-t); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .side { display:flex; flex-direction:column; height:640px; position:sticky; top:12px; }
  .ptabs { display:flex; border-bottom:1px solid var(--line); }
  .ptabs button { flex:1; border:none; background:none; padding:10px 4px; color:var(--sub); border-bottom:2px solid transparent; font-size:13px; }
  .ptabs button.on { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
  .pbody { flex:1; overflow-y:auto; padding:12px; }
  .msg { padding:8px 10px; border-radius:10px; margin-bottom:8px; font-size:13px; white-space:pre-wrap; }
  .msg.me { background:var(--accent-soft); margin-left:24px; }
  .msg.ai { background:var(--soft); margin-right:24px; }
  .issue { border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; }
  .issue.done { opacity:.55; }
  .issue .h { display:flex; justify-content:space-between; gap:6px; margin-bottom:4px; }
  .issue .loc { color:var(--sub); font-size:12px; }
  .issue textarea { min-height:44px; font-size:13px; margin:6px 0; }
  .issue .ref { font-size:12px; color:var(--sub); margin-top:4px; }
  .ask { border-top:1px solid var(--line); padding:10px; }
  .scope { font-size:12px; margin-bottom:6px; display:flex; gap:6px; align-items:center; }
  .scope span { background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:6px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ask form { display:flex; gap:6px; }
  .hist { font-size:12px; border-bottom:1px solid var(--line); padding:8px 0; }
  .pop { position:absolute; z-index:40; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px;
         box-shadow:0 6px 24px rgba(0,0,0,.15); display:flex; gap:6px; flex-wrap:wrap; max-width:320px; }
  .pop textarea { min-height:60px; }
  .mtabs { display:none; }
  .summary { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  @media (max-width:1000px) {
    .ed { grid-template-columns:1fr; }
    .ed > section { min-height:0; }
    .ed > section.mhide { display:none; }
    .side { height:560px; position:static; }
    .mtabs { display:flex; margin-bottom:10px; }
    .doc { padding:16px; }
  }

  /* 녹취록 */
  .spk { display:inline-flex; gap:6px; align-items:center; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .spk i { width:10px; height:10px; border-radius:50%; background:var(--sc); display:inline-block; }
  .line { display:grid; grid-template-columns:120px 64px 1fr; gap:10px; padding:8px; border-radius:8px; }
  .line:hover { background:var(--soft); }
  .line.on { background:var(--accent-soft); }
  .line .who { font-weight:600; color:var(--sc); font-size:13px; }
  .line .who select { font-size:12px; padding:2px 4px; margin-top:2px; }
  .line .time { color:var(--sub); font-size:12px; white-space:nowrap; }
  .line .txt { outline:none; border-radius:4px; }
  .line .txt:focus { background:var(--card); box-shadow:0 0 0 1px var(--accent); }
  @media (max-width:640px) { .line { grid-template-columns:1fr; gap:2px; } }
  .player { position:sticky; top:0; z-index:5; background:var(--accent); color:var(--on-accent); padding:8px 12px; border-radius:8px; margin-bottom:8px; font-size:13px; }
  .report { background:var(--card); border:1px solid var(--line); padding:24px; border-radius:4px; font-size:13px; }
  .report .rt { text-align:center; font-weight:700; font-size:16px; margin-bottom:14px; }
  .report .src { font-size:11px; color:var(--accent); cursor:pointer; white-space:nowrap; }
  .report td.loc { background:var(--soft); font-weight:600; }
  .report td.empty { color:var(--sub); font-style:italic; }

  /* 관리자 */
  .adm { display:grid; grid-template-columns:200px minmax(0,1fr); gap:16px; }
  .adm .menu button { display:block; width:100%; text-align:left; border:none; background:none; padding:9px 12px; border-radius:8px; }
  .adm .menu button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  @media (max-width:800px) { .adm { grid-template-columns:1fr; } .adm .menu { display:flex; overflow-x:auto; gap:4px; }
    .adm .menu button { white-space:nowrap; width:auto; } }
  .swatch { width:14px; height:14px; border-radius:4px; background:var(--c); display:inline-block; vertical-align:middle; }
  .switch { display:inline-flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<header>
  <div class="hd">
    <span class="logo">과제 개발 포털</span>
    <span class="proj" id="proj"></span>
    <div class="seg" id="modeSeg">
      <button data-act="mode" data-v="user">이용자</button>
      <button data-act="mode" data-v="admin">관리자</button>
    </div>
  </div>
  <nav class="stages" id="stages"></nav>
</header>
<main id="main"></main>
<div id="pop" class="pop hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =====================================================================
   1. 예시 데이터 (시안용으로 지어낸 내용)
   ===================================================================== */
const CHECKS0 = [
  { id:'real',  name:'현실적합성',   color:'#f79009', calc:true,  where:[2,4,5], on:true,
    prompt:'실제 있는 법령·제도인지, 그 직급에 그 권한이 있는지, 예산·인원 규모가 현실적인지, 날짜와 요일이 맞는지 점검한다. 문제마다 위치, 이유, 고친 안을 적는다.' },
  { id:'typo',  name:'오탈자',       color:'#e31b54', calc:false, where:[2,4,5], on:true,
    prompt:'맞춤법, 띄어쓰기, 오타, 기관명·인물명 표기 불일치를 찾는다.' },
  { id:'calc',  name:'수치 계산',    color:'#7a5af8', calc:true,  where:[2,4,5], on:true,
    prompt:'예산 합계, 비율, 증감률, 인원 합계를 찾아 계산 코드로 검산한다. 표와 차트 안의 숫자도 포함한다.' },
  { id:'match', name:'자료 간 일치', color:'#0ba5ec', calc:true,  where:[2,4,5], on:true,
    prompt:'같은 사실(금액, 날짜, 인물, 직위, 개수)이 자료마다 다르게 적혔는지, 자료끼리 조건이 충돌하는지 찾는다.' },
  { id:'basis', name:'근거 없는 내용', color:'#66c61c', calc:false, where:[2,4,5], on:true,
    prompt:'다른 자료에 근거가 없는 주장이나 결론을 찾는다.' },
  { id:'expr',  name:'표현',         color:'#ee46bc', calc:false, where:[2,4,5], on:true,
    prompt:'뜻이 모호한 용어, 응시자에게 정답을 알려 주는 표현, 차별적 표현을 찾는다.' },
  { id:'struct',name:'구성 점검',     color:'#667085', calc:true,  where:[5], on:true,
    prompt:'자료 번호가 빠지거나 겹치는지, 표지의 "총 n장" 안내와 실제 장수가 맞는지, 쪽 번호가 이어지는지 점검한다.' },
  { id:'guide', name:'과제-가이드 일치', color:'#15b79e', calc:true, where:[2,4,5], on:true,
    prompt:'평가자가이드가 정답 근거로 든 자료·수치가 과제에 실제로 있는지, 과제의 숫자와 가이드의 계산 답이 맞는지 점검한다.' },
];
const REVIEW_CHECK = { id:'review', name:'검토의견', color:'#2f5bea' };
const CHAT_CHECK = { id:'chat', name:'채팅 요청', color:'#475467' };

// 블록: g=묶음, doc=평가과제/평가자가이드
const BLOCKS0 = [
  { id:'c0', doc:'평가과제', g:'구조', title:'표지', page:'', text:'평가대상자용 과제 : 집단토론(GD)\n[ 평가과제 ]\n평가과제는 총 9장(표지 제외)으로 구성되어 있습니다.\n평가 시작 전, 빠진 쪽이 없는지 확인하십시오.' },
  { id:'c1', doc:'평가과제', g:'구조', title:'평가방법 안내', page:'1', text:'· 평가 시간: 준비 30분, 토론 50분\n· 토론 중에는 자료에 메모할 수 있으나, 자료를 다른 평가대상자에게 보여 줄 수 없습니다.' },
  { id:'c2', doc:'평가과제', g:'구조', title:'상황개요', page:'2', text:'※ 오늘은 2031년 3월 4일(수)입니다.\n귀하는 한빛시 교통국 소속 과장입니다. 한빛시는 공영자전거 "한빛바이크"를 7년째 운영하고 있으나 이용 감소와 운영 적자가 이어지고 있습니다.\n회의 안건: ① 한빛바이크 재정비의 기본 방향 수립 ② 각 과가 제안한 세부 사업 중 3개 선정' },
  { id:'c3', doc:'평가과제', g:'구조', title:'가상조직', page:'3', text:'교통국장\n├ 교통정책과: 대중교통 정책 수립, 공영자전거 운영 총괄\n├ 재정관리과: 교통 사업 예산 편성·집행 관리\n└ 시민소통과: 민원 처리, 시민 의견 수렴' },
  { id:'d1', doc:'평가과제', g:'공통 자료', title:'자료 1. 신문기사', page:'4', text:'한빛바이크, 7년 만에 갈림길에 서다\n한빛일보 박○○ 기자 / 2031. 2. 20.\n한빛바이크 이용 건수는 2028년 연 410만 건에서 2030년 연 296만 건으로 줄었다. 같은 기간 고장 자전거 비율은 8%에서 15%로 높아졌다. 시민들은 "빌리러 가면 고장 난 자전거만 남아 있다"고 말한다.\n시는 올해 안에 운영 방식을 바꾸겠다는 입장이다.' },

/* ---------- 공통 편집 화면 ---------- */
function editorHTML(stage) {
  const b = B(S.cur);
  const checks = S.checks.filter(c => c.on && c.where.includes(stage));
  const open = S.issues.filter(i => i.status === 'open');
  const groups = {};
  S.blocks.forEach(x => (groups[x.g] = groups[x.g] || []).push(x));
  let tree = '', lastDoc = '';
  Object.keys(groups).forEach(g => {   // 묶음 순서는 파일에서 처음 나온 순서를 따른다(용역마다 다름)
    if (!groups[g]) return;
    const d = groups[g][0].doc;
    if (d !== lastDoc) { tree += `<div class="top">${d}</div>`; lastDoc = d; }
    if (g !== '평가자가이드') tree += `<div class="grp">${esc(g)}</div>`;
    groups[g].forEach(x => {
      const n = open.filter(i => i.block === x.id).length;
      tree += `<button data-act="pick" data-v="${x.id}" class="${x.id===S.cur?'on':''}">
        ${x.text!==S.base[x.id]?'<span class="dot" title="바뀐 블록"></span>':''}${S.impact[x.id]?'<span title="함께 확인 필요">⚠️</span>':''}
        <span>${esc(x.title)}</span>${n?`<span class="cnt">${n}</span>`:''}<span class="pg">${x.page?x.page+'쪽':''}</span></button>`;
    });
  });
  const summary = stage === 5 ? `<div class="summary">${S.checks.filter(c=>c.on&&c.where.includes(5)).map(c=>{
      const n = S.issues.filter(i=>i.check===c.id&&i.status==='open').length; return `<span class="tag" style="border-left:3px solid ${c.color}">${esc(c.name)} ${n}</span>`; }).join('')}</div>` : '';
  const tabs = [['chat','채팅'],['issues',`점검 결과 ${open.length}`],['hist',`버전 기록 ${S.history.length}`]];
  return `
  ${stage===4?reqSummary():''}
  ${summary}
  <div class="mtabs seg">${[['tree','목록'],['doc','문서'],['side','채팅·결과']].map(([k,n])=>`<button data-act="mtab" data-v="${k}" class="${S.mtab===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="ed">
    <section class="tree ${S.mtab!=='tree'?'mhide':''}">${tree}</section>
    <section class="${S.mtab!=='doc'?'mhide':''}">
      <div class="docbar">
        ${stage===5?`<button class="btn pri sm" data-act="runAll">전체 점검</button>`:''}
        ${checks.map(c=>`<button class="ckbtn" style="--c:${c.color}" data-act="runCheck" data-v="${c.id}">${esc(c.name)}</button>`).join('')}
        <span class="grow"></span>
        <label class="switch" style="font-size:12px"><input type="checkbox" data-act="diff" ${S.diff?'checked':''}> 바뀐 부분 보기</label>
        <button class="btn sm" data-act="export">${stage===2?'pptx·가이드 받기':'pptx로 받기'}</button>
      </div>
      <div class="doc">
        ${S.impact[b.id]?`<div class="impact">⚠️ <span class="grow">함께 확인 필요: ${esc(S.impact[b.id])}</span><button class="btn sm" data-act="impactOk">확인함</button></div>`:''}
        <div class="title">${esc(b.title)}</div>
        <div class="meta">${b.doc} · ${esc(b.g)}${b.page?` · ${b.page}쪽`:''}${b.sheets?` · ${b.sheets}장`:''} — 글자를 드래그하면 그 부분만 고칠 수 있습니다.</div>
        <div id="docbody">${S.diff ? diffHTML(S.base[b.id], b.text) : bodyHTML(b)}</div>
      </div>
    </section>
    <section class="side ${S.mtab!=='side'?'mhide':''}">
      <div class="ptabs">${tabs.map(([k,n])=>`<button data-act="panel" data-v="${k}" class="${S.panel===k?'on':''}">${n}</button>`).join('')}</div>
      <div class="pbody" id="pbody">${S.panel==='chat'?chatHTML():S.panel==='issues'?issuesHTML():histHTML()}</div>
      <div class="ask">
        <div class="scope">수정 범위: <span>${S.scope?esc(S.scope.label):esc(b.title)}</span>${S.scope?`<button class="btn sm" data-act="clearScope">해제</button>`:''}</div>
        <form data-act-submit="ask"><input type="text" id="askIn" class="grow" placeholder="예: 현실적합성 떨어지는 부분 알려 줘"><button class="btn pri">보내기</button></form>
      </div>
    </section>

}
function bodyHTML(b) {
  // 열린 점검 결과 위치에 밑줄 표시
  let marks = S.issues.filter(i => i.block === b.id && i.status === 'open');
  return b.text.split('\n').map(line => {
    if (/^\[\d+\/\d+\]/.test(line)) return `<div class="sheet">${esc(line)}</div>`;
    if (/^\[그림\]/.test(line)) return `<div class="figure">🖼 ${esc(line.slice(4).trim())} — 그림은 AI가 고치지 않습니다. 직접 고쳐야 할 곳으로 표시됩니다.</div>`;
    let h = esc(line);
    marks.forEach(m => { const f = esc(m.find); if (h.includes(f)) h = h.replace(f, `<mark class="iss ${S.activeIssue===m.id?'sel':''}" style="--c:${chk(m.check).color}" data-act="focusIssue" data-v="${m.id}">${f}</mark>`); });
    if (line.startsWith('|')) return `<table><tr>${h.split('|').slice(1,-1).map(c=>`<td>${c.trim()}</td>`).join('')}</tr></table>`;
    return `<p>${h || '&nbsp;'}</p>`;
  }).join('').replace(/<\/table><table>/g,'');
}
function diffHTML(a, b) {
  if (a === b) return `<p class="muted">초안과 비교해 바뀐 부분이 없습니다.</p>` + bodyHTML({ ...B(S.cur), text:b });
  const A = a.split(/(\s+)/), Bt = b.split(/(\s+)/), n = A.length, m = Bt.length;
  const L = Array.from({length:n+1},()=>new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===Bt[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,out='';
  while (i<n && j<m) { if (A[i]===Bt[j]) { out+=esc(A[i]); i++; j++; } else if (L[i+1][j]>=L[i][j+1]) out+=`<del>${esc(A[i++])}</del>`; else out+=`<ins>${esc(Bt[j++])}</ins>`; }
  while (i<n) out+=`<del>${esc(A[i++])}</del>`; while (j<m) out+=`<ins>${esc(Bt[j++])}</ins>`;
  return `<p class="muted" style="font-size:12px">초안과 비교: <del>지운 글자</del> <ins>넣은 글자</ins></p>` + out.split('\n').map(l=>`<p>${l||'&nbsp;'}</p>`).join('');
}
function chatHTML() {
  if (!S.chat.length) return `<p class="muted">점검 버튼에 없는 점검이나 수정은 여기에 적으세요.<br><br>예)<br>· 자료 2를 더 짧게 줄여 줘<br>· 자료 3과 자료 5의 예산이 맞는지 다시 봐 줘<br>· 현실적합성 떨어지는 부분 알려 줘</p>`;
  return S.chat.map(m => `<div class="msg ${m.me?'me':'ai'}">${esc(m.t)}</div>`).join('');
}
function issuesHTML() {

      <div class="field"><label>지침 프롬프트 <small>무엇을 어떤 기준으로 찾을지</small></label><textarea data-c="${c.id}" data-k="prompt">${esc(c.prompt)}</textarea></div>
      <div class="row" style="gap:16px">
        <label class="switch"><input type="checkbox" data-c="${c.id}" data-k="calc" ${c.calc?'checked':''}> 계산 코드 사용</label>
        <label class="switch">표시 색 <input type="color" data-c="${c.id}" data-k="color" value="${c.color}"></label>
        <span class="switch">보이는 단계 ${[2,4,5].map(w=>`<label class="switch"><input type="checkbox" data-c="${c.id}" data-k="where" value="${w}" ${c.where.includes(w)?'checked':''}>${'①②③④⑤'[w-1]}</label>`).join(' ')}</span>
        <label class="switch"><input type="checkbox" data-c="${c.id}" data-k="on" ${c.on?'checked':''}> 사용</label>
        <span class="grow"></span><button class="btn sm" data-act="cDel" data-v="${c.id}">지우기</button></div></div>`:`<div class="muted" style="font-size:13px;margin-top:4px">${esc(c.prompt)}</div>`}
  </div>`; }).join('')}
  <button class="btn" data-act="cAdd">+ 점검 항목 추가</button>`;
}
function aLib() {
  return `<h1>참고자료 저장소</h1><p class="lead">주제 탐색, 과제 초안, 검토의견 반영에서 함께 찾아 씁니다. 문서마다 발주처·연도·기법·직급을 붙이면 검색할 때 거를 수 있습니다.</p>
  <label class="slot"><span class="grow"><b>자료 올리기</b> <span class="muted">pptx, pdf, docx, hwp, csv</span></span><span class="btn sm">파일 올리기</span><input type="file" data-slot="lib" multiple></label>
  <table class="t"><tr><th>종류</th><th>발주처</th><th>연도</th><th>기법</th><th>직급</th></tr>${LIB.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
}
function aForms() {
  return `<h1>양식·구조 관리</h1><p class="lead">이용자가 확인한 보고서 양식과 과제 파일 구조가 용역별로 저장됩니다. 같은 용역의 다음 회의·다음 파일에서 다시 씁니다.</p>
  <h2>보고서 양식</h2>
  <table class="t"><tr><th>양식 이름</th><th>파일</th><th>칸</th><th>최근 사용</th><th></th></tr>
  <tr><td>○○시 5급 역량평가 · 과제 검토회의 결과</td><td>hwpx (hwp에서 바꿈)</td><td>8</td><td>2031-03-04</td><td><button class="btn sm" data-act="soon">칸 구성 보기</button></td></tr>
  <tr><td>△△도 4급 역량평가 · 검토위원회 회의록</td><td>hwpx</td><td>6</td><td>2030-11-20</td><td><button class="btn sm" data-act="soon">칸 구성 보기</button></td></tr></table>
  <h2>과제 파일 구조</h2>
  <table class="t"><tr><th>용역</th><th>방향·크기</th><th>자료 표기</th><th>묶음 규칙</th></tr>
  <tr><td>○○시 5급 역량평가</td><td>세로 · A4</td><td>자료 N.</td><td>구조 / 공통 자료 / 역할 간지별 묶음</td></tr>
  <tr><td>△△도 4급 역량평가</td><td>가로 · 16:9</td><td>[자료 N]</td><td>구조 / 자료 (간지 없음)</td></tr></table>`;
}
function aSettings() {
  return `<h1>설정</h1>
  <div class="card"><label class="switch"><input type="checkbox" data-bind="web" ${S.web?'checked':''}> <b>웹 검색 사용</b></label>
    <p class="muted" style="margin-top:4px">끄면 주제 탐색의 시의성 확인과 의견 반영의 참고 조사를 사내 참고자료로만 합니다.</p></div>
  <div class="card"><div class="lbl">이용자 권한</div><table class="t"><tr><th>이름</th><th>권한</th></tr>
    <tr><td>김○○</td><td>관리자</td></tr><tr><td>이○○</td><td>이용자</td></tr><tr><td>박○○</td><td>이용자</td></tr></table></div>`;
}

/* =====================================================================
   4. 동작
   ===================================================================== */
function addHistory(block, before, after, who, why) {
  S.history.push({ v:S.history.length+1, block, before, after, who, why });
  // 작업 원칙 7: 바뀐 글이 다른 블록(가이드 포함)에도 있으면 "함께 확인 필요"
  const gone = before.split(/[\s,.:()]+/).filter(w => w.length>1 && /\d/.test(w) && !after.includes(w));
  S.blocks.forEach(x => { if (x.id !== block && gone.some(w => x.text.includes(w)))
    S.impact[x.id] = `${B(block).title}에서 "${gone.join(', ')}"을(를) 고쳤습니다. 이 블록에도 같은 내용이 있습니다.`; });
}
function setText(id, text, who, why) { const b = B(id); const before = b.text; if (before === text) return; b.text = text; addHistory(id, before, text, who, why); }
let issueSeq = 1;
function runCheck(id, quiet) {
  const c = chk(id);
  const found = FINDINGS.filter(f => f.check === id && B(f.block).text.includes(f.find) && !S.issues.some(i => i.check===id && i.find===f.find && i.status==='open'));
  found.forEach(f => S.issues.push({ ...f, id:issueSeq++, status:'open' }));
  const total = S.issues.filter(i => i.check===id && i.status==='open').length;
  if (!quiet) { S.chat.push({ t:`${c.name} 점검을 마쳤습니다. 결과 ${total}건${FINDINGS.some(f=>f.check===id)?'':' (새로 등록한 항목은 시안에 예시 결과가 없습니다)'}.` }); S.panel = 'issues'; }
  return total;
}
function apply(iid) {
  const i = S.issues.find(x => x.id === iid); const ta = document.querySelector(`[data-fix="${iid}"]`); if (ta) i.fix = ta.value;
  const b = B(i.block);
  if (!b.text.includes(i.find)) { toast('원문이 이미 바뀌어 반영할 수 없습니다.'); return; }
  setText(i.block, b.text.replace(i.find, i.fix), i.check==='chat'?'이용자':'AI', `${chk(i.check).name}: “${i.find}” → “${i.fix}”`);
  i.status = 'applied'; S.cur = i.block; render(); toast('반영했습니다. 버전 기록에 남았습니다.');
}
function ask(text) {
  S.chat.push({ me:true, t:text });
  const hit = S.checks.filter(c => c.on && text.includes(c.name.slice(0,3)));
  if (hit.length) hit.forEach(c => runCheck(c.id));
  else if (S.scope && S.scope.type === 'sel') {
    // API 연결 지점: 선택한 글 + 요청을 모델에 보내 고친 안을 받는다
    S.issues.push({ id:issueSeq++, check:'chat', block:S.scope.block, find:S.scope.text, fix:S.scope.text, why:`요청: ${text}\n(시안에서는 AI 수정안 대신 원문이 들어 있습니다. 직접 고쳐 [반영]해 보세요.)`, status:'open' });
    S.chat.push({ t:'선택한 부분의 고친 안을 점검 결과 탭에 올렸습니다.' }); S.panel = 'issues';
  } else S.chat.push({ t:`"${S.scope?S.scope.label:B(S.cur).title}" 범위로 요청을 받았습니다. 실제 연결 시 AI가 고친 안을 점검 결과 탭에 올립니다.` });
  render();
}
const ACT = {
  mode: el => { S.mode = el.dataset.v; render(); },
  stage: el => { S.stage = +el.dataset.v; S.scope = null; S.diff = false; render(); },
  s1method: el => { S.s1.method = el.dataset.v; render(); },
  findTopics: () => { S.s1.cands = 'loading'; $('cands').innerHTML = '<div class="loading">기출 DB와 주제풀을 검색하는 중…</div>'; setTimeout(() => { S.s1.cands = true; render(); }, 600); },
  reroll: () => { const q = $('s1ask').value.trim(); S.s1.shift++; render(); if (q) toast(`조건 반영: ${q}`); },
  pickTopic: el => { S.s1.topic = TOPICS[+el.dataset.v]; render(); },
  s1back: () => { S.s1.topic = null; render(); },
  toDraft: () => { S.slots.story = `스토리맵_${S.s1.topic.title}.md (① 주제 탐색에서 넘어옴)`; S.stage = 2; render(); },
  fillSlots: () => { S.slots.story = S.slots.story || '스토리맵_공영자전거.md'; S.slots.task = '2029_집단토론_평가과제.pptx'; S.slots.guide = '2029_집단토론_평가자가이드.pptx'; render(); },
  makeDraft: () => { S.draft = 'loading'; render(); setTimeout(() => { S.draft = 'ready'; render(); }, 700); },
  pick: el => { S.cur = el.dataset.v; S.scope = null; S.mtab = 'doc'; render(); },
  panel: el => { S.panel = el.dataset.v; render(); },
  mtab: el => { S.mtab = el.dataset.v; render(); },
  diff: () => { S.diff = !S.diff; render(); },
  runCheck: el => { runCheck(el.dataset.v); render(); },
  runAll: () => { const n = S.checks.filter(c => c.on && c.where.includes(5)).reduce((s,c) => s + runCheck(c.id, true), 0); S.chat.push({ t:`전체 점검을 마쳤습니다. 결과 ${n}건.` }); S.panel='issues'; render(); },
  apply: el => apply(+el.dataset.v),
  ignore: el => { S.issues.find(x => x.id === +el.dataset.v).status = 'ignored'; render(); },
  focusIssue: el => { const i = S.issues.find(x => x.id === +el.dataset.v); S.cur = i.block; S.activeIssue = i.id; S.panel = 'issues'; S.diff = false; render();
    const c = $('iss-'+i.id); c && c.scrollIntoView({ block:'nearest' }); },
  impactOk: () => { delete S.impact[S.cur]; render(); },
  clearScope: () => { S.scope = null; render(); },
  viewVer: el => { S.cur = S.history[+el.dataset.v-1].block; S.diff = true; render(); },
  restore: el => { const h = S.history[+el.dataset.v-1]; setText(h.block, h.before, '이용자', `v${h.v} 수정 전으로 되돌림`); S.cur = h.block; render(); toast('되돌렸습니다.'); },
  export: () => toast('시안에서는 파일을 만들지 않습니다. 실제로는 원본 pptx의 글자만 바꿔 내보냅니다.'),
  // ③
  demoAudio: () => startStt('검토회의_1차_0304.m4a'),
  editSpk: el => { S.editSpk = +el.dataset.v; render(); },
  cancelSpk: () => { S.editSpk = null; render(); },
  saveSpk: () => { const p = S.speakers[S.editSpk]; p.name = $('spName').value.trim() || `Speaker ${S.editSpk+1}`; p.org = $('spOrg').value.trim(); p.role = $('spRole').value; S.editSpk = null; render(); },
  play: el => { S.playing = +el.dataset.v; render(); },
  stop: () => { S.playing = null; render(); },
  jump: el => { S.playing = +el.dataset.v; render(); $('ln-'+el.dataset.v).scrollIntoView({ block:'center' }); },
  makeReport: () => {
    const none = S.speakers.filter(p => !p.role).map(p => p.name);
    if (none.length) { S.report = false; S.roleWarn = none; render(); return; }
    S.roleWarn = null; S.report = true; render(); },
  demoRoles: () => { [['김○○','○○대학교 교수','검토위원'],['이○○','△△대학교 교수','검토위원'],['박○○','개발사 연구원','개발사'],['최○○','○○시 인재개발과 주무관','발주처']]
    .forEach(([n,o,r],i) => Object.assign(S.speakers[i], { name:n, org:o, role:r })); S.roleWarn = null; render(); },
  repAsk: () => { const q = $('repAsk').value.trim(); if (q) toast(`요청을 받았습니다: ${q}`); },
  hwpx: () => toast('시안에서는 파일을 만들지 않습니다. 실제로는 저장된 양식(hwpx)의 칸에 채워 내보냅니다.'),
  toS4: () => { S.stage = 4; render(); },
  // ④
  makeFixes: () => {
    S.reqs.filter(r => r.on).forEach(r => {
      const f = FINDINGS.find(x => x.check === r.req.check && B(x.block).text.includes(x.find)); if (!f) return;
      S.issues.push({ ...f, id:issueSeq++, check:'review', why:`${r.loc} ${r.op}${r.cl?`\n발주처: ${r.cl}`:''}\n반영 방향: ${r.plan}`, ref:r.ref || '참고: 같은 기법의 기출 과제 2건을 찾아 비교함', status:'open' });
    });
    S.s4 = 'edit'; S.panel = 'issues'; S.cur = 'd3'; render();
  },
  structOk: () => { S.draft = 'ready'; render(); toast('구조를 저장했습니다. 같은 용역의 다음 파일에 먼저 적용됩니다.'); },
  merge: el => { const i = S.blocks.findIndex(b => b.id === el.dataset.v), prev = S.blocks.slice(0, i).reverse().find(b => b.doc === '평가과제');
    prev.text += '\n' + S.blocks[i].text; S.base[prev.id] = prev.text; prev.page = [prev.page, S.blocks[i].page].filter(Boolean).join(', ');
    if (S.cur === S.blocks[i].id) S.cur = prev.id; S.blocks.splice(i, 1); render(); },
  s4list: () => { S.s4 = 'list'; render(); },
  reqTable: () => toast('시안에서는 파일을 만들지 않습니다. 실제로는 "요청 → 반영 여부 → 고친 위치" 표를 엑셀로 내보냅니다.'),
  // 관리자
  atab: el => { S.adminTab = el.dataset.v; render(); },
  pPick: el => { S.editPrompt = +el.dataset.v; render(); },
  pMode: el => { S.prompts.find(x => x.id === S.editPrompt).mode = el.dataset.v; render(); },
  pTest: () => toast('예시 파일로 시험 실행을 마쳤습니다. (시안)'),
  pSave: () => { const p = S.prompts.find(x => x.id === S.editPrompt); const t = $('pText'); if (t) p.text = t.value;
    const n = +p.ver[0][0].slice(1) + 1; p.ver.unshift([`v${n}`, new Date().toISOString().slice(0,10), '관리자', $('pNote').value.trim() || '내용 수정']); render(); toast('저장했습니다. 모든 이용자에게 바로 적용됩니다.'); },
  pRestore: () => toast('선택한 버전으로 되돌렸습니다. (시안)'),
  cEdit: el => { S.editCheck = S.editCheck === el.dataset.v ? null : el.dataset.v; render(); },
  cUp: el => { const i = +el.dataset.v; [S.checks[i-1], S.checks[i]] = [S.checks[i], S.checks[i-1]]; render(); },
  cDel: el => { S.checks = S.checks.filter(c => c.id !== el.dataset.v); render(); },
  cAdd: () => { const id = 'n' + Date.now(); S.checks.push({ id, name:'새 점검 항목', color:'#475467', calc:false, where:[2,4,5], on:true, prompt:'' }); S.editCheck = id; render(); },
  soon: () => toast('시안에서는 목록만 보여 줍니다.'),
};
function startStt(name) {
  S.audio = name; S.stt = 'running'; render();
  setTimeout(() => { S.stt = 'done'; S.speakers = [0,1,2,3].map(i => ({ name:`Speaker ${i+1}`, org:'', role:'', c:SPK_COLORS[i] })); S.lines = clone(TRANSCRIPT0); render(); }, 800);
}

/* 이벤트 연결 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.type === 'checkbox' && el.dataset.act !== 'diff') return;
  if (el.tagName === 'A') e.preventDefault();
  if (ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.actSubmit === 'ask') { const v = $('askIn').value.trim(); if (v) ask(v); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind) { const path = t.dataset.bind.split('.'); const o = path.length > 1 ? S[path[0]] : S; o[path[path.length-1]] = t.type === 'checkbox' ? t.checked : t.value; render(); return; }
  if (t.dataset.slot) {
    const name = t.files[0] ? t.files[0].name : ''; if (!name) return;
    if (t.dataset.slot === 'audio') return startStt(name);
    if (t.dataset.slot === 'form') { toast(/\.hwp$/i.test(name) ? 'hwp 양식은 한글에서 "다른 이름으로 저장 → hwpx"로 바꾼 뒤 다시 올려 주세요.' : `${name}을(를) 읽고 칸 8개를 찾았습니다. (시안)`); return; }
    if (['pptx4','pptx5'].includes(t.dataset.slot)) { S.draft = 'struct'; S.structFile = name; render(); return; }
    if (t.dataset.slot in S.slots) { S.slots[t.dataset.slot] = name; render(); return; }
    toast(`${name}을(를) 올렸습니다. (시안)`); return;
  }
  if (t.dataset.field) { S.fields[+t.dataset.field].v = t.value; return; }
  if (t.dataset.line) { S.lines[+t.dataset.line].s = +t.value; render(); return; }
  if (t.dataset.grp) { B(t.dataset.grp).g = t.value; return; }
  if (t.dataset.req) { S.reqs[+t.dataset.req].on = t.checked; render(); return; }
  if (t.dataset.c) { const c = S.checks.find(x => x.id === t.dataset.c), k = t.dataset.k;
    if (k === 'where') c.where = t.checked ? [...c.where, +t.value].sort() : c.where.filter(w => w !== +t.value);
    else c[k] = t.type === 'checkbox' ? t.checked : t.value;
    render(); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.bind && t.type === 'text' || t.tagName === 'TEXTAREA' && t.dataset.bind) { const p = t.dataset.bind.split('.'); S[p[0]][p[1]] = t.value; } });
document.addEventListener('focusout', e => { const t = e.target; if (t.dataset && t.dataset.txt) S.lines[+t.dataset.txt].text = t.innerText; });

/* 드래그 선택 → 작은 메뉴 */
function hidePop() { $('pop').classList.add('hidden'); }
document.addEventListener('mouseup', e => {
  if (e.target.closest('#pop')) return;
  const body = $('docbody'); const sel = window.getSelection(); const txt = sel.toString().trim();
  if (!body || !txt || txt.length < 2 || !body.contains(sel.anchorNode) || S.diff) { if (!e.target.closest('#pop')) hidePop(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect(), pop = $('pop');
  const blk = S.cur;
  pop.innerHTML = `<button class="btn sm pri" id="popAi">AI에게 고쳐 달라고 하기</button><button class="btn sm" id="popMe">직접 고치기</button>`;
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 330)) + 'px';
  pop.style.top = (window.scrollY + r.bottom + 6) + 'px';
  pop.classList.remove('hidden');
  $('popAi').onclick = () => { S.scope = { type:'sel', block:blk, text:txt, label:`선택한 글 “${txt.slice(0,20)}${txt.length>20?'…':''}”` }; S.panel = 'chat'; S.mtab = 'side'; render(); $('askIn').focus(); };
  $('popMe').onclick = () => {
    pop.innerHTML = `<textarea id="popTa" style="width:300px">${esc(txt)}</textarea><button class="btn sm pri" id="popSave">저장</button><button class="btn sm" id="popX">취소</button>`;
    $('popTa').focus();
    $('popX').onclick = hidePop;
    $('popSave').onclick = () => { const b = B(blk); if (!b.text.includes(txt)) { toast('여러 줄에 걸친 선택은 한 줄씩 고쳐 주세요.'); return; }
      setText(blk, b.text.replace(txt, $('popTa').value), '이용자', `직접 고침: “${txt.slice(0,30)}”`); hidePop(); render(); toast('고쳤습니다. 버전 기록에 남았습니다.'); };
  };
});
render();
</script>
